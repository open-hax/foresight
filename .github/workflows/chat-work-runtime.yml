name: Chat work runtime

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/chat-work-runtime.yml"
      - "LICENSE"
      - "tools/chat-work-runtime/**"
  push:
    paths:
      - ".github/workflows/chat-work-runtime.yml"
      - "LICENSE"
      - "tools/chat-work-runtime/**"

permissions:
  contents: read

concurrency:
  group: chat-work-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Foresight
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail
          tools/chat-work-runtime/build.sh
      - name: Smoke test relocated tools
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf -- "$tmp_dir"' EXIT
          mkdir -p "$tmp_dir/home"
          tar --no-same-owner -xzf dist/foresight-chat-work-linux-x64.tar.gz -C "$tmp_dir"
          runtime="$tmp_dir/foresight-chat-work-linux-x64"
          env -i HOME="$tmp_dir/home" PATH="$runtime/bin:/usr/bin:/bin" nbb --version
          env -i HOME="$tmp_dir/home" PATH="$runtime/bin:/usr/bin:/bin" bb --version
          env -i HOME="$tmp_dir/home" PATH="$runtime/bin:/usr/bin:/bin" clj-kondo --version
          env -i HOME="$tmp_dir/home" PATH="$runtime/bin:/usr/bin:/bin" jscpd --version
          (cd "$runtime" && sha256sum --check SHA256SUMS)
      - name: Upload runtime archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foresight-chat-work-linux-x64
          path: |
            dist/foresight-chat-work-linux-x64.tar.gz
            dist/foresight-chat-work-linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
