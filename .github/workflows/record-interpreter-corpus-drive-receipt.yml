name: Record interpreter corpus Drive receipt

on:
  push:
    branches:
      - research/repository-census
    paths:
      - .github/workflows/record-interpreter-corpus-drive-receipt.yml

permissions:
  contents: write

concurrency:
  group: record-interpreter-corpus-drive-receipt
  cancel-in-progress: false

jobs:
  append-and-remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: research/repository-census
          fetch-depth: 1

      - name: Verify research artifact and append receipt once
        shell: bash
        run: |
          set -euo pipefail
          document="docs/research/interpreter-corpus-drive-boundary.md"
          expected="f73f2d96b2fa2419fc1730954b9b6ce5eb66fdcafe663759a940a061c371be56"
          actual="$(sha256sum "$document" | cut -d' ' -f1)"
          test "$actual" = "$expected"

          marker='Record the interpreter/corpus/Drive boundary as a working research constraint'
          if ! grep -Fq "$marker" .ημ/receipts.edn; then
            cat >> .ημ/receipts.edn <<'EOF'
{:ts "2026-08-30T00:57:22Z", :kind :observation, :repo "https://github.com/open-hax/foresight", :origin "chatgpt", :owner "gpt-5.6-pro", :dod "Record the interpreter/corpus/Drive boundary as a working research constraint without silently promoting it to an accepted ADR or executing the migration", :pi "foresight/repository-census", :host "chatgpt-github-connector+github-actions/ubuntu-24.04", :manifest ["docs/research/interpreter-corpus-drive-boundary.md" ".ημ/receipts.edn"], :refs ["open-hax/foresight#60" "c32ba10c86db2ef1cffd3bd80033b68e7f2101a4" "sha256:f73f2d96b2fa2419fc1730954b9b6ce5eb66fdcafe663759a940a061c371be56"], :note "The note separates the NBB execution host, reusable Calliope/Clio/Katamorph interpreters, corpus repositories, immutable blob identity, and Google Drive provider locators. It preserves LFS occurrences as historical evidence and specifies active-tree removal before any separately accepted history rewrite.", :tests ["PASS committed document SHA-256 equals f73f2d96b2fa2419fc1730954b9b6ce5eb66fdcafe663759a940a061c371be56" "NOT RUN no Calliope corpus split, LFS materialization, Drive upload, resolver implementation, or migration was executed"]}
EOF
          fi

          rm .github/workflows/record-interpreter-corpus-drive-receipt.yml
          git diff --check

      - name: Commit receipt and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "foresight-receipt-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ημ/receipts.edn .github/workflows/record-interpreter-corpus-drive-receipt.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(research): record interpreter corpus boundary receipt"
          git push origin HEAD:research/repository-census
